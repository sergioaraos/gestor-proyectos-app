<!-- SERGIO 2026-09-17: rediseno visual del formulario de alta (feature/diseno-visual) -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo proyecto</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="detail-container">
        <a class="back-link" href="/">&larr; Volver al listado</a>
        <h1>Nuevo proyecto</h1>
        <form class="form-container" method="post" action="/nuevo">
            <label>Nombre</label>
            <input type="text" name="nombre" required>

            <!-- SERGIO 2026-09-18: el cliente se elige de la lista en vez de escribirlo (feature/tabla-clientes) -->
            <label>Cliente</label>
            <select name="cliente">
                <option value="">Sin cliente</option>
                {% for c in clientes %}
                <option value="{{ c.nombre }}">{{ c.nombre }}</option>
                {% endfor %}
            </select>
            <p class="ayuda-form"><a href="/clientes">+ Agregar cliente nuevo</a></p>

            <label>Prioridad</label>
            <select name="prioridad">
                <option value="alta">Alta</option>
                <option value="media" selected>Media</option>
                <option value="baja">Baja</option>
            </select>

            <!-- SERGIO 2026-09-18: prefijo de carpeta fijo, solo se pide el nombre final (feature/prefijo-carpeta) -->
            <label>Carpeta</label>
            <div class="carpeta-input">
                <span class="carpeta-prefijo">{{ ruta_base }}\</span>
                <input type="text" name="carpeta_nombre" placeholder="nombre-del-proyecto">
            </div>

            <label>Herramienta</label>
            <select name="herramienta">
                <option value="Claude Code">Claude Code</option>
                <option value="Cowork">Cowork</option>
                <option value="Kiro">Kiro</option>
                <option value="Otra">Otra</option>
            </select>

            <button class="btn" type="submit">Crear proyecto</button>
        </form>
    </div>
</body>
</html>
