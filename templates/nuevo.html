<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo proyecto</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="detail-container">
        <a class="back-link" href="/">&larr; Volver al listado</a>
        <h1>Nuevo proyecto</h1>
        <form class="form-container" method="post" action="/nuevo">
            <label>Nombre</label>
            <input type="text" name="nombre" required>

            <label>Cliente</label>
            <input type="text" name="cliente">

            <label>Prioridad</label>
            <select name="prioridad">
                <option value="alta">Alta</option>
                <option value="media" selected>Media</option>
                <option value="baja">Baja</option>
            </select>

            <label>Carpeta (ruta completa en tu computador)</label>
            <input type="text" name="carpeta" placeholder="C:\laragon\www\...">

            <label>Herramienta</label>
            <select name="herramienta">
                <option value="Claude Code">Claude Code</option>
                <option value="Cowork">Cowork</option>
                <option value="Kiro">Kiro</option>
                <option value="Otra">Otra</option>
            </select>

            <button class="btn" type="submit">Crear proyecto</button>
        </form>
    </div>
</body>
</html>
