<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestor de Proyectos</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="topbar">
        <h1>Gestor de Proyectos</h1>
        <a class="btn" href="/nuevo">+ Nuevo proyecto</a>
    </div>

    {% if projects %}
    <div class="grid">
        {% for p in projects %}
        <div class="card">
            <h2><a href="/proyecto/{{ p.id }}">{{ p.nombre }}</a></h2>
            <div class="cliente">{{ p.cliente }}</div>
            <div class="badges">
                <span class="badge badge-prioridad-{{ p.prioridad }}">{{ p.prioridad }}</span>
                <span class="badge badge-estado">{{ p.estado }}</span>
                <span class="badge badge-herramienta">{{ p.herramienta }}</span>
            </div>
            <div class="carpeta">{{ p.carpeta }}</div>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <p class="empty-state">Todavía no hay proyectos registrados.</p>
    {% endif %}
</body>
</html>
